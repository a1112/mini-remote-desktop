# signaling-rs 服务器配置

# 监听端口 (默认: 9527)
port = 9527

# 监听地址 (默认: "0.0.0.0")
host = "0.0.0.0"

# WebSocket 通道容量 (默认: 32)
# 防止内存耗尽的有界通道大小
channel_capacity = 32

# 最大消息大小 (字节，默认: 1048576 = 1MB)
# 拒绝超过此大小的消息
max_msg_size = 1048576

# 心跳间隔 (秒，默认: 30)
# 清理超时连接的检查间隔
heartbeat_interval_secs = 30

# 连接超时 (秒，默认: 60)
# 客户端在此时间内未发送心跳将被断开
connection_timeout_secs = 60
