[package]
name = "mrd-decode"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
openh264 = "0.8"
mrd-pipeline-core = { path = "../mrd-pipeline-core" }
mrd-decode-nvdec = { path = "../mrd-decode-nvdec" }
mrd-ffmpeg = { path = "../mrd-ffmpeg" }
rust_h265 = { version = "0.1.0", optional = true }
shiguredo_dav1d = { version = "2026.1.0", optional = true }
vvdec = { version = "0.6.11", optional = true }

[features]
default = []
production-software-codecs = ["software-dav1d", "software-rust-h265"]
production-vvc-software-codec = ["software-vvdec"]
software-dav1d = ["dep:shiguredo_dav1d"]
software-rust-h265 = ["dep:rust_h265"]
software-vvdec = ["dep:vvdec"]

[dev-dependencies]
mrd-encode-openh264 = { path = "../mrd-encode-openh264" }
mrd-encode-nvenc = { path = "../mrd-encode-nvenc" }
mrd-observability = { path = "../mrd-observability" }
serde_json = { workspace = true }
