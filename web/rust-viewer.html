<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rust Agent Viewer</title>
  <style>
    body { margin: 0; background: #111; color: #eee; font-family: Segoe UI, sans-serif; }
    .bar { display: flex; gap: 12px; align-items: center; padding: 10px 12px; background: #1a1a1a; border-bottom: 1px solid #333; }
    #status { font-size: 13px; color: #9acd32; }
    #device { background: #222; color: #eee; border: 1px solid #444; padding: 6px 8px; min-width: 220px; }
    .wrap { display: flex; justify-content: center; align-items: center; height: calc(100vh - 48px); }
    #frame { max-width: 100%; max-height: 100%; object-fit: contain; background: #000; }
    #placeholder { color: #888; }
  </style>
</head>
<body>
  <div class="bar">
    <div id="status">WS: connecting...</div>
    <label for="device">设备</label>
    <select id="device"></select>
    <div id="meta"></div>
  </div>
  <div class="wrap">
    <img id="frame" alt="Rust stream frame" style="display:none;" />
    <div id="placeholder">等待 Rust Agent 画面...</div>
  </div>

  <script type="module" src="./rust-viewer.js"></script>
</body>
</html>
