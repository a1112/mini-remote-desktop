[workspace]
members = [
  "apps/Rdesk/src-tauri",
  "apps/realtime-server",
  "common-control-proto",
  "crates/mrd-capture-dxgi",
  "crates/mrd-decode",
  "crates/mrd-decode-nvdec",
  "crates/mrd-encode-nvenc",
  "crates/mrd-encode-openh264",
  "crates/mrd-observability",
  "crates/mrd-pipeline-core",
  "crates/mrd-proto",
  "crates/mrd-render",
  "crates/mrd-render-d3d11",
  "crates/mrd-session",
  "crates/mrd-signal-client",
  "crates/mrd-signal-proto",
  "crates/mrd-signal-server",
  "crates/mrd-transport-quic-quinn",
  "crates/mrd-transport-webrtc",
  "heartbeat-rs",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
