[workspace]
members = [
  "apps/Rdesk/src-tauri",
  "apps/rdesk-legacy-harness",
  "apps/realtime-server",
  "apps/mrd-service",
  "common-control-proto",
  "crates/mrd-capture-dxgi",
  "crates/mrd-capture-macos",
  "crates/mrd-capture-winrt",
  "crates/mrd-codec-videotoolbox",
  "crates/mrd-decode",
  "crates/mrd-decode-nvdec",
  "crates/mrd-encode-nvenc",
  "crates/mrd-encode-nvenc-av1",
  "crates/mrd-encode-openh264",
  "crates/mrd-ipc",
  "crates/mrd-observability",
  "crates/mrd-application",
  "crates/mrd-pipeline-core",
  "crates/mrd-proto",
  "crates/mrd-render",
  "crates/mrd-render-d3d11",
  "crates/mrd-render-macos",
  "crates/mrd-session",
  "crates/mrd-signal-client",
  "crates/mrd-signal-proto",
  "crates/mrd-signal-server",
  "crates/mrd-transport-quic-quinn",
  "crates/mrd-transport-webrtc",
  "crates/mrd-buffer-pool",
  "crates/mrd-hardware",
  "heartbeat-rs",
  "tests/capture-render-demo",
  "tests/integration",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"

[profile.dev.package.app]
opt-level = 2

[profile.dev.package.mrd-encode-openh264]
opt-level = 3

[profile.dev.package.mrd-capture-macos]
opt-level = 3

[profile.dev.package.mrd-codec-videotoolbox]
opt-level = 3

[profile.dev.package.mrd-render-macos]
opt-level = 3

[profile.dev.package.openh264]
opt-level = 3

[profile.dev.package.openh264-sys2]
opt-level = 3

[profile.dev.package.shiguredo_video_toolbox]
opt-level = 3
