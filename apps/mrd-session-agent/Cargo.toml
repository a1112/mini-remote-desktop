[package]
name = "mrd-session-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mrd_session_agent"
path = "src/lib.rs"

[[bin]]
name = "mrd-session-agent"
path = "src/main.rs"

[dependencies]
ed25519-dalek.workspace = true
mrd-agent-ipc = { path = "../../crates/mrd-agent-ipc" }
mrd-input = { path = "../../crates/mrd-input" }
mrd-proto = { path = "../../crates/mrd-proto" }
ring.workspace = true
thiserror.workspace = true
tokio.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_System_SystemServices", "Win32_System_Threading"] }

[dev-dependencies]
mrd-session = { path = "../../crates/mrd-session" }
mrd-service = { path = "../mrd-service" }
