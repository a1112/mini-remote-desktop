[package]
name = "realtime-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "realtime_server"
path = "src/lib.rs"

[dependencies]
axum = { workspace = true, features = ["ws"] }
futures-util = "0.3"
mrd-proto = { path = "../../crates/mrd-proto" }
mrd-identity = { path = "../../crates/mrd-identity" }
mrd-signal-client = { path = "../../crates/mrd-signal-client" }
mrd-signal-proto = { path = "../../crates/mrd-signal-proto" }
serde.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ring.workspace = true
base64 = "0.22"
serde_json.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }

[[bin]]
name = "realtime-server"
path = "src/main.rs"
