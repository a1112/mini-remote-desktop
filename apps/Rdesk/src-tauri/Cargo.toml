[package]
name = "app"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
default-run = "app"
edition = "2021"
rust-version = "1.60"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
base64 = "0.22"
bytes = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
mrd-proto = { path = "../../../crates/mrd-proto" }
mrd-session = { path = "../../../crates/mrd-session" }
mrd-ipc = { path = "../../../crates/mrd-ipc" }
mrd-pipeline-core = { path = "../../../crates/mrd-pipeline-core" }
mrd-capture-dxgi = { path = "../../../crates/mrd-capture-dxgi" }
mrd-decode = { path = "../../../crates/mrd-decode" }
mrd-decode-nvdec = { path = "../../../crates/mrd-decode-nvdec" }
mrd-encode-nvenc = { path = "../../../crates/mrd-encode-nvenc" }
mrd-encode-openh264 = { path = "../../../crates/mrd-encode-openh264" }
mrd-observability = { path = "../../../crates/mrd-observability" }
mrd-render = { path = "../../../crates/mrd-render" }
mrd-render-d3d11 = { path = "../../../crates/mrd-render-d3d11" }
mrd-signal-client = { path = "../../../crates/mrd-signal-client" }
mrd-signal-proto = { path = "../../../crates/mrd-signal-proto" }
mrd-transport-quic-quinn = { path = "../../../crates/mrd-transport-quic-quinn" }
anyhow = "1.0"
tracing = "0.1"
mrd-transport-webrtc = { path = "../../../crates/mrd-transport-webrtc" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
sysinfo = "0.30"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
num_cpus = "1.16"
webrtc = "0.12"
rustls = "0.23.5"
tauri-plugin-shell = { git = "https://github.com/tauri-apps/plugins-workspace", version = "2.3.5" }
tauri-plugin-dialog = { git = "https://github.com/tauri-apps/plugins-workspace", version = "2.7.0" }
tauri-plugin-fs = { git = "https://github.com/tauri-apps/plugins-workspace", version = "2.5.0" }
window-vibrancy = "0.7.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[dev-dependencies]
openh264 = "0.8"
mrd-service = { path = "../../mrd-service" }

[target.'cfg(windows)'.dependencies]
mrd-capture-winrt = { path = "../../../crates/mrd-capture-winrt" }
mrd-encode-nvenc-av1 = { path = "../../../crates/mrd-encode-nvenc-av1" }
winreg = "0.52"
winapi = { version = "0.3", features = ["sysinfoapi", "minwindef"] }
windows = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_OpenGL",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
dispatch2 = "0.3"
mrd-capture-macos = { path = "../../../crates/mrd-capture-macos" }
mrd-codec-videotoolbox = { path = "../../../crates/mrd-codec-videotoolbox" }
mrd-render-macos = { path = "../../../crates/mrd-render-macos" }
objc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
mrd-capture-pipewire = { path = "../../../crates/mrd-capture-pipewire", features = ["portal"] }
mrd-render-linux = { path = "../../../crates/mrd-render-linux" }
mrd-encode-nvenc-av1 = { path = "../../../crates/mrd-encode-nvenc-av1" }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]
