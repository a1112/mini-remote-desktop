[package]
name = "mrd-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mrd_service"
path = "src/lib.rs"

[[bin]]
name = "mrd-service"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
mrd-application = { path = "../../crates/mrd-application" }
mrd-decode = { path = "../../crates/mrd-decode" }
mrd-encode-openh264 = { path = "../../crates/mrd-encode-openh264" }
mrd-ipc = { path = "../../crates/mrd-ipc" }
mrd-pipeline-core = { path = "../../crates/mrd-pipeline-core" }
mrd-proto = { path = "../../crates/mrd-proto" }
mrd-transport-quic-quinn = { path = "../../crates/mrd-transport-quic-quinn" }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
mrd-capture-winrt = { path = "../../crates/mrd-capture-winrt" }

[target.'cfg(target_os = "macos")'.dependencies]
mrd-capture-macos = { path = "../../crates/mrd-capture-macos" }
