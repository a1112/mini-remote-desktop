[package]
name = "controller-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
bytes = "1.7"
base64 = "0.22"
futures-util = "0.3"
quinn = "0.11"
rustls = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

# WebRTC - 与 agent-rust 相同
webrtc = "0.12"
rtp = "0.12"
rtcp = "0.12"
common-control-proto = { path = "../common-control-proto" }

# Windows 特定依赖
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Media_MediaFoundation",
] }

# FFmpeg 解码器 (可选)
ffmpeg-next = { version = "6.1", optional = true, features = ["static"] }

[features]
default = ["ffmpeg-software", "mf-decoder"]
ffmpeg-software = ["ffmpeg-next"]
mf-decoder = []
d3d11-video = []
nvdec = []
