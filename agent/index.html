<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Remote Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      text-align: center;
      padding: 30px;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #0f0, #0a0);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }
    .icon svg {
      width: 40px;
      height: 40px;
      fill: #000;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .status {
      font-size: 13px;
      color: #888;
      margin-bottom: 20px;
    }
    .status-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 8px 0;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #444;
    }
    .dot.connecting { background: #fc0; animation: blink 1s infinite; }
    .dot.registered { background: #0f0; }
    .dot.connected { background: #0f0; box-shadow: 0 0 10px #0f0; }
    .dot.disconnected { background: #f00; }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .info {
      margin-top: 30px;
      padding: 15px 20px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      font-size: 12px;
      color: #666;
    }
    .select-screen {
      display: none;
      margin-top: 20px;
    }
    .select-screen h3 {
      font-size: 14px;
      margin-bottom: 15px;
    }
    .screen-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .screen-item {
      padding: 10px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
    }
    .screen-item:hover {
      background: rgba(255,255,255,0.1);
    }
    .screen-item.selected {
      border-color: #0f0;
    }
    .screen-thumb {
      width: 100%;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .screen-name {
      font-size: 11px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM8 15c0-1.66 1.34-3 3-3 .35 0 .69.07 1 .18V6h5v2h-3v7.03c-.02 1.64-1.35 2.97-3 2.97-1.66 0-3-1.34-3-3z"/>
      </svg>
    </div>
    <h1>Mini Remote Agent</h1>
    <div class="status">
      <div class="status-item">
        <span class="dot" id="wsDot"></span>
        <span id="wsStatus">初始化中...</span>
      </div>
      <div class="status-item">
        <span class="dot" id="connDot"></span>
        <span id="connStatus">等待连接</span>
      </div>
    </div>

    <div class="select-screen" id="selectScreen">
      <h3>选择要共享的屏幕</h3>
      <div class="screen-list" id="screenList"></div>
    </div>

    <div class="info">
      被控端正在运行，可以被远程控制
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
