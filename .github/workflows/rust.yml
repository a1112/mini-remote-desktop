name: Cross-platform CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  rustfmt:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust-core:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libx11-dev \
            libxrandr-dev \
            libxcb-randr0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-core-${{ runner.os }}

      - name: Test service kernel and signaling
        run: >-
          cargo test --locked
          -p mrd-ipc
          -p mrd-session
          -p mrd-application
          -p mrd-signal-proto
          -p mrd-signal-client
          -p mrd-signal-server
          -p realtime-server
          -p mrd-service
          -- --test-threads=1

  desktop-shell:
    name: Desktop shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libx11-dev \
            libxrandr-dev \
            libxcb-randr0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-shell-${{ runner.os }}

      - name: Prepare macOS check-only service resource
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p target/release/MrdService.app/Contents/MacOS
          touch target/release/MrdService.app/Contents/MacOS/mrd-service

      - name: Check native desktop host
        run: cargo check --locked -p app --bin app

  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        working-directory: apps/Rdesk

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/Rdesk/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm exec vitest run --maxWorkers=1
      - run: pnpm build

  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        working-directory: apps/Rdesk-Server

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/Rdesk-Server/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app
      - run: python -m pytest -q

  backend-integration:
    name: Backend integration (PostgreSQL and realtime)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/Rdesk-Server/requirements-dev.txt
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: backend-integration
      - run: python -m pip install -r apps/Rdesk-Server/requirements-dev.txt
      - run: cargo build --locked -p realtime-server
      - name: Run backend tests with local PostgreSQL and WebSocket fixtures
        working-directory: apps/Rdesk-Server
        shell: bash
        run: |
          if ! command -v pg_config >/dev/null || [[ ! -x "$(pg_config --bindir)/initdb" ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql libpq-dev
          fi
          pg_bin="$(pg_config --bindir)"
          fixture_dir="$(mktemp -d "$RUNNER_TEMP/mrd-pg.XXXXXX")"
          socket_dir="$fixture_dir/socket"
          pg_port=59441
          mkdir -m 700 "$socket_dir"
          stop_postgres() {
            if [[ -f "$fixture_dir/data/postmaster.pid" ]]; then
              "$pg_bin/pg_ctl" -D "$fixture_dir/data" -m fast -w stop
            fi
          }
          trap stop_postgres EXIT
          "$pg_bin/initdb" -D "$fixture_dir/data" -U oidc_fixture --auth=trust --no-locale --encoding=UTF8
          "$pg_bin/pg_ctl" -D "$fixture_dir/data" -l "$fixture_dir/postgres.log" \
            -o "-h '' -p $pg_port -k '$socket_dir' -c unix_socket_permissions=0700" -w start

          test_db="postgresql+asyncpg://oidc_fixture@/postgres?host=$socket_dir&port=$pg_port"
          RDESK_ENVIRONMENT=test \
            RDESK_DB_URL="$test_db" \
            MRD_TEST_DATABASE_URL="$test_db" \
            MRD_OIDC_TEST_SOCKET="$socket_dir" \
            MRD_OIDC_TEST_PORT="$pg_port" \
            MRD_REALTIME_TEST_BINARY="$GITHUB_WORKSPACE/target/debug/realtime-server" \
            python -m pytest -q

  full-workspace-linux:
    name: Full Rust workspace (Linux)
    runs-on: ubuntu-latest
    needs: rust-core
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            nasm \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libx11-dev \
            libxrandr-dev \
            libxcb-randr0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: full-workspace-linux
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --lib --bins --locked
