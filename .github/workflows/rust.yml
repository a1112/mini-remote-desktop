name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Linux system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          pkg-config \
          libglib2.0-dev \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev \
          libsoup-3.0-dev \
          librsvg2-dev \
          libxdo-dev \
          libssl-dev \
          libdbus-1-dev \
          libpipewire-0.3-dev \
          libx11-dev \
          libxrandr-dev \
          libxcb-randr0-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev
    - name: Build
      run: cargo build --bins --verbose
    - name: Run tests
      run: cargo test --lib --bins --verbose
