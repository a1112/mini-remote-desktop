<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Remote Desktop - 控制端</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
    }
    .container {
      display: flex;
      height: 100%;
    }
    /* 侧边栏 */
    .sidebar {
      width: 280px;
      background: #111;
      border-right: 1px solid #222;
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid #222;
    }
    .sidebar-header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }
    .status {
      padding: 12px 20px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f00;
    }
    .status-dot.online { background: #0f0; }
    .status-dot.connecting { background: #ff0; }
    .device-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    .device-item {
      padding: 12px;
      margin-bottom: 8px;
      background: #1a1a1a;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .device-item:hover {
      background: #252525;
    }
    .device-item.connected {
      background: #1a3a1a;
      border: 1px solid #0f0;
    }
    .device-icon {
      width: 32px;
      height: 32px;
      background: #333;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .device-info {
      flex: 1;
    }
    .device-name {
      font-size: 14px;
      font-weight: 500;
    }
    .device-status {
      font-size: 11px;
      color: #888;
    }
    /* 主区域 */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .video-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #remoteVideo {
      max-width: 100%;
      max-height: 100%;
      background: #000;
    }
    .placeholder {
      text-align: center;
      color: #666;
    }
    .placeholder svg {
      width: 80px;
      height: 80px;
      margin-bottom: 16px;
      opacity: 0.3;
    }
    .control-bar {
      height: 60px;
      background: #111;
      border-top: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 0 20px;
    }
    .btn {
      padding: 10px 20px;
      background: #222;
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn:hover:not(:disabled) {
      background: #333;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn.primary {
      background: #0f0;
      color: #000;
    }
    .btn.primary:hover:not(:disabled) {
      background: #0c0;
    }
    .btn.danger {
      background: #f00;
      color: #fff;
    }
    /* 质量指示器 */
    .stats {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      border-radius: 6px;
      font-size: 11px;
      font-family: monospace;
    }
    .stats div {
      margin: 2px 0;
    }
    .badge {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      margin-left: auto;
    }
    .badge.online { background: #0f0; color: #000; }
  </style>
</head>
<body>
  <div class="container">
    <!-- 侧边栏 -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h1>Mini Remote</h1>
      </div>
      <div class="status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">连接中...</span>
      </div>
      <div class="device-list" id="deviceList">
        <div style="padding: 20px; text-align: center; color: #666;">
          等待设备上线...
        </div>
      </div>
    </div>

    <!-- 主区域 -->
    <div class="main">
      <div class="video-container">
        <video id="remoteVideo" autoplay playsinline style="display:none;"></video>
        <div class="placeholder" id="placeholder">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM9 8h6v2H9V8zm0 3h6v2H9v-2zm0 3h6v2H9v-2z"/>
          </svg>
          <p>选择设备开始远程控制</p>
        </div>
        <div class="stats" id="stats" style="display:none;">
          <div>延迟: <span id="latency">-</span> ms</div>
          <div>码率: <span id="bitrate">-</span> Mbps</div>
          <div>帧率: <span id="fps">-</span> fps</div>
          <div>丢包: <span id="packetLoss">-</span>%</div>
        </div>
      </div>
      <div class="control-bar">
        <button class="btn" id="btnConnect" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
          </svg>
          连接
        </button>
        <button class="btn danger" id="btnDisconnect" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4 11H8v-2h8v2z"/>
          </svg>
          断开
        </button>
        <button class="btn" id="btnFullscreen" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
          </svg>
          全屏
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
