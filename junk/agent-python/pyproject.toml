[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-python"
version = "0.1.0"
description = "High-performance Python agent for mini-remote-desktop"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Project", email = "project@example.com"}
]
dependencies = [
    "websockets>=16.0",
    "aiortc>=1.14.0",
    "av>=16.0.1,<17.0.0",
    "numpy>=2.4.4",
    "pillow>=12.2.0",
]

[project.optional-dependencies]
windows = [
    "pywin32>=311",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent_python" = ["../config.json"]
