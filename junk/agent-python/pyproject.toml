[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-python"
version = "0.1.0"
description = "High-performance Python agent for mini-remote-desktop"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Project", email = "project@example.com"}
]
dependencies = [
    "websockets>=12.0",
    "aiortc>=1.6.0",
    "av>=12.0",
    "numpy>=1.24",
    "pillow>=10.0",
    "d3dshot>=0.1.15",
]

[project.optional-dependencies]
windows = [
    "pywin32>=306",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent_python" = ["../config.json"]
